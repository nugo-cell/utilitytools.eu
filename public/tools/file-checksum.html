  <style>
    .fc-drop{border:2px dashed var(--border-strong);border-radius:12px;padding:30px 18px;text-align:center;cursor:pointer;background:var(--panel-2);color:var(--muted);display:block;transition:.15s}

    .fc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .fc-item{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
    .fc-item .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .fc-item .name{font-weight:600;word-break:break-all}

    .fc-item .bar{height:5px;background:var(--panel);border-radius:99px;overflow:hidden;margin-top:6px}

    .fc-item.match{border-color:var(--success)}
    .fc-item.mismatch{border-color:var(--danger)}
    .fc-badge{font-size:12px;font-weight:700;margin-top:6px}
    .fc-badge.ok{color:var(--success)} .fc-badge.bad{color:var(--danger)}

<body>
  <header class="topnav">
    <a href="/" class="brand">Utility<span>Tools</span></a>
    <nav><a href="/">Tools</a><a href="/blog">Blog</a><a href="/about">About</a></nav>
  </header>

  <main class="container">
    <div class="tool-header">
      <h1>File Checksum (SHA-256)</h1>
      <p>Calculate SHA-256 checksums of local files and verify them against a published hash. Files are read in chunks in your browser and are never uploaded. Need to hash text instead? Use the <a href="/hash">Hash Generator</a>.</p>
    </div>

    <div class="panel">
      <label class="fc-drop" id="drop">
        <input type="file" id="fileInput" multiple>
        <div><b>Click or drop files</b> to calculate their SHA-256 checksum</div>
        <div style="font-size:12px;margin-top:4px">Large files are processed in streaming chunks, so they do not have to fit in memory.</div>
      </label>

      <label for="expected" style="margin-top:16px">Expected checksum (optional)</label>
      <textarea id="expected" style="min-height:70px" placeholder="Paste a SHA-256 hash, or the contents of a .sha256 / SHA256SUMS file (hash  filename per line)"></textarea>
      <div class="row" style="margin-top:10px">
        <label class="btn-secondary" style="margin:0;cursor:pointer;font-size:14px;color:var(--text)">
          📄 Load checksum file<input type="file" id="sumFile" accept=".sha256,.txt,.sum,text/plain" hidden>
        </label>
        <button type="button" class="secondary" id="exportBtn" disabled>⬇ Download SHA256SUMS</button>
        <button type="button" class="secondary" id="copyAllBtn" disabled>Copy all</button>
        <button type="button" class="secondary" id="cancelBtn" hidden>Cancel</button>
        <button type="button" class="secondary" id="clearBtn" style="margin-left:auto">Clear</button>
      </div>
      <div id="status" class="status"></div>
      <div class="fc-list" id="list"></div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    // ---- Incremental SHA-256 (FIPS 180-4) so huge files can be streamed ----
    const K = new Uint32Array([
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ]);
    class Sha256 {
      constructor() {
        this.h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
        this.w = new Uint32Array(64);
        this.buf = new Uint8Array(64);
        this.bufLen = 0;
        this.bytes = 0;
      }
      block(d, o) {
        const w = this.w, h = this.h;
        for (let i = 0; i < 16; i++, o += 4) w[i] = (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];
        for (let i = 16; i < 64; i++) {
          const a = w[i - 15], b = w[i - 2];
          const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
          const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
        }
        let A = h[0], B = h[1], C = h[2], D = h[3], E = h[4], F = h[5], G = h[6], H = h[7];
        for (let i = 0; i < 64; i++) {
          const S1 = ((E >>> 6) | (E << 26)) ^ ((E >>> 11) | (E << 21)) ^ ((E >>> 25) | (E << 7));
          const t1 = (H + S1 + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
          const S0 = ((A >>> 2) | (A << 30)) ^ ((A >>> 13) | (A << 19)) ^ ((A >>> 22) | (A << 10));
          const t2 = (S0 + ((A & B) ^ (A & C) ^ (B & C))) | 0;
          H = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
        }
        h[0] += A; h[1] += B; h[2] += C; h[3] += D; h[4] += E; h[5] += F; h[6] += G; h[7] += H;
      }
      update(data) {
        let i = 0;
        const n = data.length;
        this.bytes += n;
        if (this.bufLen) {
          while (i < n && this.bufLen < 64) this.buf[this.bufLen++] = data[i++];
          if (this.bufLen < 64) return;
          this.block(this.buf, 0); this.bufLen = 0;
        }
        for (; i + 64 <= n; i += 64) this.block(data, i);
        while (i < n) this.buf[this.bufLen++] = data[i++];
      }
      digest() {
        const bits = this.bytes * 8;
        const pad = new Uint8Array(((this.bufLen < 56) ? 56 : 120) - this.bufLen + 8);
        pad[0] = 0x80;
        const hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;
        const p = pad.length;
        pad[p - 8] = hi >>> 24; pad[p - 7] = hi >>> 16; pad[p - 6] = hi >>> 8; pad[p - 5] = hi;
        pad[p - 4] = lo >>> 24; pad[p - 3] = lo >>> 16; pad[p - 2] = lo >>> 8; pad[p - 1] = lo;
        const saved = this.bytes; this.update(pad); this.bytes = saved;
        return [...this.h].map(x => x.toString(16).padStart(8, '0')).join('');
      }
    }

    const CHUNK = 4 * 1024 * 1024;
    const SMALL = 64 * 1024 * 1024; // below this, use the native Web Crypto digest
    const results = []; // { name, hash, el }
    let queue = [], running = false, cancelled = false;

    function fmtBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(2) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
    function setStatus(msg, ok) { $('status').textContent = msg; $('status').className = 'status ' + (ok ? 'ok' : 'err'); }

    function expectedMap() {
      const byName = new Map(), loose = [];
      $('expected').value.split(/\r?\n/).forEach(line => {
        const m = line.match(/\b([a-fA-F0-9]{64})\b(?:\s+\*?(.+))?/) ;
        if (!m) return;
        const h = m[1].toLowerCase();
        // Also accept BSD style: SHA256 (file) = hash
        const bsd = line.match(/^SHA256\s*\((.+)\)\s*=/i);
        const name = bsd ? bsd[1] : (m[2] || '').trim();
        if (name) byName.set(name.replace(/^.*[\\/]/, ''), h); else loose.push(h);
      });
      return { byName, loose };
    }

    function verify(r) {
      const { byName, loose } = expectedMap();
      const badge = r.el.querySelector('.fc-badge');
      r.el.classList.remove('match', 'mismatch');
      badge.className = 'fc-badge'; badge.textContent = '';
      if (!r.hash) return;
      let exp = byName.get(r.name);
      if (!exp && loose.length) exp = loose.includes(r.hash) ? r.hash : (loose.length === 1 ? loose[0] : null);
      if (!exp && !byName.size && !loose.length) return;
      if (exp === r.hash) { r.el.classList.add('match'); badge.className = 'fc-badge ok'; badge.textContent = '✓ Matches the expected checksum'; }
      else if (exp) { r.el.classList.add('mismatch'); badge.className = 'fc-badge bad'; badge.textContent = '✗ Does NOT match the expected checksum'; }
      else { badge.className = 'fc-badge'; badge.textContent = 'No expected checksum listed for this file name'; }
    }

    function addFiles(files) {
      for (const file of files) {
        const el = document.createElement('div');
        el.className = 'fc-item';
        el.innerHTML = `<div class="top"><span class="name">${esc(file.name)}</span><span class="meta">${fmtBytes(file.size)} · <span class="pct">queued</span></span></div>
          <div class="bar"><div></div></div><div class="hash" title="Click to copy">…</div><div class="fc-badge"></div>`;
        $('list').appendChild(el);
        const r = { name: file.name, hash: null, el };
        results.push(r);
        queue.push({ file, r });
      }
      run();
    }

    async function hashFile(file, onProgress) {
      if (file.size <= SMALL && crypto.subtle) {
        const buf = await file.arrayBuffer();
        onProgress(file.size);
        const d = await crypto.subtle.digest('SHA-256', buf);
        return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
      const h = new Sha256();
      for (let off = 0; off < file.size; off += CHUNK) {
        if (cancelled) throw new Error('cancelled');
        const part = new Uint8Array(await file.slice(off, off + CHUNK).arrayBuffer());
        h.update(part);
        onProgress(Math.min(off + CHUNK, file.size));
        await new Promise(r => setTimeout(r, 0));
      }
      return h.digest();
    }

    async function run() {
      if (running) return;
      running = true; cancelled = false;
      $('cancelBtn').hidden = false;
      while (queue.length) {
        const { file, r } = queue.shift();
        const bar = r.el.querySelector('.bar > div'), pct = r.el.querySelector('.pct');
        const t0 = performance.now();
        try {
          const hash = await hashFile(file, done => {
            const p = file.size ? done / file.size * 100 : 100;
            bar.style.width = p.toFixed(1) + '%'; pct.textContent = p.toFixed(0) + '%';
          });
          r.hash = hash;
          r.el.querySelector('.hash').textContent = hash;
          bar.style.width = '100%';
          pct.textContent = `done in ${((performance.now() - t0) / 1000).toFixed(2)} s`;
          verify(r);
        } catch (e) {
          pct.textContent = cancelled ? 'cancelled' : 'failed';
          r.el.querySelector('.hash').textContent = cancelled ? 'Cancelled' : 'Could not read file: ' + e.message;
          if (cancelled) { queue.forEach(q => { q.r.el.querySelector('.pct').textContent = 'cancelled'; q.r.el.querySelector('.hash').textContent = 'Cancelled'; }); queue = []; }
        }
      }
      running = false;
      $('cancelBtn').hidden = true;
      const done = results.filter(r => r.hash);
      $('exportBtn').disabled = $('copyAllBtn').disabled = !done.length;
      if (done.length) setStatus(`${done.length} file${done.length === 1 ? '' : 's'} hashed ✓`, true);
    }

    function sumsText() { return results.filter(r => r.hash).map(r => `${r.hash}  ${r.name}`).join('\n') + '\n'; }

    const drop = $('drop');
    ['dragover', 'dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.toggle('drag', ev === 'dragover'); }));
    drop.addEventListener('drop', e => addFiles([...(e.dataTransfer.files || [])]));
    $('fileInput').onchange = e => { addFiles([...(e.target.files || [])]); e.target.value = ''; };
    $('expected').addEventListener('input', () => results.forEach(verify));
    $('sumFile').onchange = async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f) return;
      if (f.size > 1048576) { setStatus('Checksum file is too large (max 1 MB).', false); return; }
      $('expected').value = await f.text();
      results.forEach(verify);
      setStatus('Loaded ' + f.name, true);
    };
    $('list').addEventListener('click', async e => {
      const el = e.target.closest('.hash'); if (!el || !/^[a-f0-9]{64}$/.test(el.textContent)) return;
      try { await navigator.clipboard.writeText(el.textContent); setStatus('Copied ✓', true); } catch (_) { setStatus('Copy failed', false); }
    });
    $('copyAllBtn').onclick = async () => {
      try { await navigator.clipboard.writeText(sumsText()); setStatus('Copied all checksums ✓', true); } catch (_) { setStatus('Copy failed', false); }
    };
    $('exportBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([sumsText()], { type: 'text/plain' }));
      a.download = 'SHA256SUMS';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('cancelBtn').onclick = () => { cancelled = true; };
    $('clearBtn').onclick = () => {
      cancelled = true; queue = [];
      results.length = 0; $('list').innerHTML = ''; $('expected').value = '';
      $('exportBtn').disabled = $('copyAllBtn').disabled = true;
      setStatus('', true);
    };
  </script>
  <script src="/site.js"></script>
</body>
