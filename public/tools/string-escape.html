<html lang="en">

  <meta name="keywords" content="string escaper, html escape, xml escape, javascript escape, json escape, sql escape, csv escape, java escape, url escape">
  <meta name="robots" content="index,follow,max-image-preview:large">

  <meta property="og:site_name" content="UtilityTools.eu">
  <meta property="og:title" content="String Escaper — HTML, XML, JS, JSON, SQL &amp; CSV">
  <meta property="og:description" content="Escape strings for HTML, XML, JavaScript, JSON, SQL and CSV. Free, browser-only.">
  <meta property="og:url" content="https://utilitytools.eu/string-escape">
  <meta property="og:image" content="https://utilitytools.eu/og-image.svg">

<body>
  <nav class="topnav">
    <div class="brand">Utility<span>Tools</span></div>
    <a class="back" href="/">← All tools</a>
  </nav>

  <div class="container">
    <div class="tool-header">
      <h1>String Escaper &amp; Utilities</h1>
      <p>Escape or unescape strings for HTML, XML, JavaScript, JSON, Java/.NET, SQL, and CSV contexts.</p>
    </div>

    <div class="panel">
      <!-- Tabs -->
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border,#e2e8f0);padding-bottom:8px" id="tabs">
        <button class="tab-btn active" data-tab="html">HTML</button>
        <button class="tab-btn" data-tab="xml">XML</button>
        <button class="tab-btn" data-tab="js">JavaScript</button>
        <button class="tab-btn" data-tab="json">JSON</button>
        <button class="tab-btn" data-tab="java">Java / .NET</button>
        <button class="tab-btn" data-tab="sql">SQL</button>
        <button class="tab-btn" data-tab="csv">CSV</button>
      </div>

      <div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap">
        <button id="escapeBtn">Escape ▶</button>
        <button id="unescapeBtn" class="secondary">◀ Unescape</button>
        <button id="copyBtn" class="secondary" style="margin-left:auto">Copy output</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      <div id="tabDesc" style="background:#f0f4ff;border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:12px;color:#2d3a8c"></div>

      <div class="split">
        <div>
          <label for="input">Input</label>
          <textarea id="input" style="font-family:monospace;font-size:0.85rem;min-height:180px" placeholder="Enter text to escape or unescape…"></textarea>
        </div>
        <div>
          <label for="output">Output</label>
          <textarea id="output" readonly style="font-family:monospace;font-size:0.85rem;min-height:180px" placeholder="Result will appear here…"></textarea>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <style>
    .tab-btn { padding:6px 14px; border-radius:6px; border:1px solid var(--border,#e2e8f0); background:#f7f9fc; cursor:pointer; font-size:0.83rem; transition:background 0.15s; }
    .tab-btn:hover { background:#e8edf3; }
    .tab-btn.active { background:var(--accent,#4f8ef7); color:#fff; border-color:var(--accent,#4f8ef7); }
  </style>

  <script>
    const input  = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const tabDesc = document.getElementById('tabDesc');

    let activeTab = 'html';

    const TABS = {
      html: {
        desc: 'Escapes &amp;, &lt;, &gt;, &quot;, and &#39; for safe use inside HTML content and attributes.',
        escape(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); },
        unescape(s) { return s.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); }
      },
      xml: {
        desc: 'Escapes &amp;, &lt;, &gt;, &quot;, and &apos; for safe use in XML documents and attributes.',
        escape(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); },
        unescape(s) { return s.replace(/&apos;/g,"'").replace(/&quot;/g,'"').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&'); }
      },
      js: {
        desc: 'Escapes special characters for safe embedding in JavaScript string literals (\\n, \\t, \\", \\\\ etc.).',
        escape(s) { return s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t').replace(/"/g,'\\"').replace(/'/g,"\\'"); },
        unescape(s) { try { return JSON.parse('"' + s.replace(/"/g,'\\"') + '"'); } catch { return s.replace(/\\n/g,'\n').replace(/\\r/g,'\r').replace(/\\t/g,'\t').replace(/\\\\/g,'\\').replace(/\\"/g,'"').replace(/\\'/g,"'"); } }
      },
      json: {
        desc: 'Escapes a string for safe embedding as a JSON string value (\\", \\\\, \\n, \\r, \\t, \\uXXXX for control chars).',
        escape(s) { return JSON.stringify(s).slice(1,-1); },
        unescape(s) { try { return JSON.parse('"' + s + '"'); } catch (e) { throw new Error('Invalid JSON string escape: ' + e.message); } }
      },
      java: {
        desc: 'Escapes strings for Java and C# / .NET string literals: \\n, \\r, \\t, \\\\, \\", unicode escapes for non-ASCII.',
        escape(s) {
          return s.split('').map(c => {
            if (c === '\n') return '\\n';
            if (c === '\r') return '\\r';
            if (c === '\t') return '\\t';
            if (c === '\\') return '\\\\';
            if (c === '"')  return '\\"';
            const code = c.charCodeAt(0);
            if (code > 127) return '\\u' + code.toString(16).padStart(4,'0');
            return c;
          }).join('');
        },
        unescape(s) {
          return s.replace(/\\u([0-9a-fA-F]{4})/g, (_,h) => String.fromCharCode(parseInt(h,16)))
                  .replace(/\\n/g,'\n').replace(/\\r/g,'\r').replace(/\\t/g,'\t')
                  .replace(/\\\\/g,'\\').replace(/\\"/g,'"');
        }
      },
      sql: {
        desc: 'Escapes single quotes for SQL string literals by doubling them (\' → \'\'). Also escapes backslashes for MySQL.',
        escape(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"''"); },
        unescape(s) { return s.replace(/''/g,"'").replace(/\\\\/g,'\\'); }
      },
      csv: {
        desc: 'Escapes a string for embedding in a CSV cell: wraps in double quotes if the value contains commas, newlines, or quotes (which are doubled).',
        escape(s) {
          if (/[,"\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
          return s;
        },
        unescape(s) {
          if (s.startsWith('"') && s.endsWith('"')) return s.slice(1,-1).replace(/""/g,'"');
          return s;
        }
      }
    };

    function setDesc() {
      tabDesc.innerHTML = TABS[activeTab].desc;
    }

    function setStatus(msg, ok) { status.textContent = msg; status.className = 'status ' + (ok ? 'ok' : 'err'); }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        setDesc();
      });
    });

    document.getElementById('escapeBtn').onclick = () => {
      const raw = input.value;
      if (!raw && raw !== '') { setStatus('Enter some text', false); return; }
      try { output.value = TABS[activeTab].escape(raw); setStatus('Escaped ✓', true); }
      catch (e) { setStatus('Error: ' + e.message, false); }
    };

    document.getElementById('unescapeBtn').onclick = () => {
      const raw = input.value;
      try { output.value = TABS[activeTab].unescape(raw); setStatus('Unescaped ✓', true); }
      catch (e) { setStatus('Error: ' + e.message, false); }
    };

    document.getElementById('copyBtn').onclick = async () => {
      if (!output.value) { setStatus('Nothing to copy', false); return; }
      try { await navigator.clipboard.writeText(output.value); setStatus('Copied ✓', true); }
      catch { setStatus('Copy failed', false); }
    };

    document.getElementById('clearBtn').onclick = () => { input.value = ''; output.value = ''; setStatus('', true); };

    setDesc();
  </script>
  <script src="/site.js"></script>
</body>
</html>
