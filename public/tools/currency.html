<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .cur-row { display:grid; grid-template-columns: 1fr auto 1fr; gap:12px; align-items:end; }
    @media (max-width:760px){ .cur-row { grid-template-columns: 1fr; } .cur-row .swap-col { order:3; text-align:center; } }
    .swap-col button { width:100%; }
    .rate-line { font-family: var(--mono); color: var(--muted); font-size:13px; margin-top:8px; }
    .chart-wrap { background: var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:12px; }
    .chart-wrap svg { width:100%; height:260px; display:block; }
    .chart-controls { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .chart-controls button { padding:5px 12px; font-size:13px; }
    .chart-controls button.on { background: var(--grad); color:#fff; border-color:transparent; }
    .src-pill { display:inline-block; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:2px 10px; font-size:11px; color:var(--muted); margin-left:6px; }
    .legend { font-size:12px; color:var(--muted); margin-top:6px; }
    table.ratetable { width:100%; border-collapse: collapse; font-size:13px; }
    table.ratetable th, table.ratetable td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:left; }
    table.ratetable th { color:var(--muted); font-weight:600; }
    table.ratetable td.num { font-family: var(--mono); text-align:right; }
  </style>

<body>
  <nav class="topnav">
    <div class="brand">Utility<span>Tools</span></div>
    <a class="back" href="/">← All tools</a>
  </nav>

  <div class="container container-narrow">
    <div class="tool-header">
      <h1>Currency Converter <span class="src-pill" id="srcPill">offline table</span></h1>
      <p>Live ECB rates with a historical chart. Falls back to an offline rates table if you have no network.</p>
    </div>

    <div class="panel">
      <div class="cur-row">
        <div>
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0" step="0.01" value="100">
          <div style="margin-top:8px">
            <label for="from">From</label>
            <select id="from"></select>
          </div>
        </div>
        <div class="swap-col">
          <label>&nbsp;</label>
          <button id="swap" class="secondary" type="button" title="Swap currencies">⇅ Swap</button>
        </div>
        <div>
          <label for="result">Converted</label>
          <input id="result" type="text" readonly>
          <div style="margin-top:8px">
            <label for="to">To</label>
            <select id="to"></select>
          </div>
        </div>
      </div>
      <div class="rate-line" id="rateLine">—</div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <label>Historical chart</label>
      <div class="chart-controls" id="rangeBtns">
        <button data-range="1m">1M</button>
        <button data-range="6m" class="on">6M</button>
        <button data-range="1y">1Y</button>
        <button data-range="5y">5Y</button>
      </div>
      <div class="chart-wrap"><svg id="chart" viewBox="0 0 600 260" preserveAspectRatio="none"></svg></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="panel">
      <label>Reference rates table (1 <span id="baseLbl">EUR</span> = …)</label>
      <table class="ratetable" id="rateTable"><thead><tr><th>Currency</th><th>Code</th><th class="num">Rate</th></tr></thead><tbody></tbody></table>
      <div class="rate-line" id="snapshotInfo"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const status = $('status');
    const set = (m, ok=true) => { status.textContent = m; status.className = 'status ' + (ok?'ok':'err'); };

    // ----- Offline rates table (EUR base, ECB snapshot ~ early 2025).
    // Used when frankfurter.app cannot be reached.
    const OFFLINE = {
      base: 'EUR', date: '2025-01-15',
      rates: {
        EUR:1, USD:1.0285, GBP:0.8419, JPY:161.45, AUD:1.6612, CAD:1.4769,
        CHF:0.9405, CNY:7.5380, HKD:8.0014, SGD:1.4032, INR:88.92, KRW:1500.10,
        NZD:1.8205, MXN:21.255, BRL:6.255, ZAR:19.305, TRY:36.45, RUB:106.20,
        PLN:4.2540, SEK:11.435, NOK:11.685, DKK:7.4585, CZK:25.215, HUF:411.10,
        RON:4.9760, BGN:1.9558, ILS:3.755, AED:3.7775, SAR:3.857, THB:35.41,
        MYR:4.620, IDR:16830, PHP:60.10, ISK:144.20, UAH:43.20
      },
      names: {
        EUR:'Euro', USD:'US Dollar', GBP:'British Pound', JPY:'Japanese Yen',
        AUD:'Australian Dollar', CAD:'Canadian Dollar', CHF:'Swiss Franc',
        CNY:'Chinese Yuan', HKD:'Hong Kong Dollar', SGD:'Singapore Dollar',
        INR:'Indian Rupee', KRW:'South Korean Won', NZD:'New Zealand Dollar',
        MXN:'Mexican Peso', BRL:'Brazilian Real', ZAR:'South African Rand',
        TRY:'Turkish Lira', RUB:'Russian Ruble', PLN:'Polish Zloty',
        SEK:'Swedish Krona', NOK:'Norwegian Krone', DKK:'Danish Krone',
        CZK:'Czech Koruna', HUF:'Hungarian Forint', RON:'Romanian Leu',
        BGN:'Bulgarian Lev', ILS:'Israeli Shekel', AED:'UAE Dirham',
        SAR:'Saudi Riyal', THB:'Thai Baht', MYR:'Malaysian Ringgit',
        IDR:'Indonesian Rupiah', PHP:'Philippine Peso', ISK:'Icelandic Krona',
        UAH:'Ukrainian Hryvnia'
      }
    };

    let live = null; // { base:'EUR', date, rates:{...} } when fetch succeeds
    function activeTable(){ return live || OFFLINE; }

    // ----- populate currency dropdowns
    const codes = Object.keys(OFFLINE.rates).sort();
    function fillSelect(sel, def){
      sel.innerHTML = codes.map(c => `<option value="${c}" ${c===def?'selected':''}>${c} — ${OFFLINE.names[c]||c}</option>`).join('');
    }
    fillSelect($('from'), 'EUR');
    fillSelect($('to'),   'USD');

    // ----- conversion
    function rate(from, to){
      const t = activeTable();
      const r = t.rates;
      // base is always EUR in our table
      if (!r[from] || !r[to]) return null;
      // 1 unit of `from` in EUR = 1 / r[from] ; then × r[to]
      return r[to] / r[from];
    }
    function convert(){
      const amt = parseFloat($('amount').value) || 0;
      const f = $('from').value, t = $('to').value;
      const r = rate(f, t);
      if (r == null) { $('result').value = '—'; return; }
      const out = amt * r;
      $('result').value = out.toLocaleString(undefined, { maximumFractionDigits: 4 });
      $('rateLine').textContent = `1 ${f} = ${r.toFixed(6)} ${t}  ·  1 ${t} = ${(1/r).toFixed(6)} ${f}`;
    }

    // ----- live rates fetch (frankfurter.app, no key, ECB based)
    async function fetchLive(){
      try {
        const r = await fetch('https://api.frankfurter.app/latest?from=EUR');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (!j || !j.rates) throw new Error('Bad payload');
        live = { base: 'EUR', date: j.date, rates: { EUR: 1, ...j.rates } };
        // Merge in any codes the API doesn't return so dropdown stays consistent
        for (const c of codes) if (live.rates[c] == null) live.rates[c] = OFFLINE.rates[c];
        $('srcPill').textContent = 'live ECB · ' + j.date;
        set('Live rates loaded (ECB · ' + j.date + ').');
        renderTable();
      } catch (e) {
        $('srcPill').textContent = 'offline table · ' + OFFLINE.date;
        set('Could not reach the live rates API — using offline table.', false);
      }
      convert();
    }

    // ----- reference rates table
    function renderTable(){
      const t = activeTable();
      $('baseLbl').textContent = t.base;
      $('snapshotInfo').textContent = (live ? 'Source: European Central Bank (frankfurter.app), ' : 'Offline snapshot, ') + t.date;
      const body = codes.filter(c => c !== t.base && t.rates[c] != null).map(c =>
        `<tr><td>${OFFLINE.names[c] || c}</td><td>${c}</td><td class="num">${t.rates[c].toFixed(4)}</td></tr>`
      ).join('');
      $('rateTable').querySelector('tbody').innerHTML = body;
    }

    // ----- historical chart
    let currentRange = '6m';
    function rangeStart(range){
      const d = new Date();
      if (range === '1m') d.setMonth(d.getMonth() - 1);
      else if (range === '6m') d.setMonth(d.getMonth() - 6);
      else if (range === '1y') d.setFullYear(d.getFullYear() - 1);
      else if (range === '5y') d.setFullYear(d.getFullYear() - 5);
      return d.toISOString().slice(0, 10);
    }
    function fmtDate(d){ return d; }

    async function loadChart(){
      const f = $('from').value, t = $('to').value;
      const svg = $('chart');
      $('legend').textContent = 'Loading…';
      svg.innerHTML = '';
      if (f === t) { $('legend').textContent = 'Same currency — no chart.'; return; }
      const start = rangeStart(currentRange);
      const end = new Date().toISOString().slice(0, 10);
      try {
        const url = `https://api.frankfurter.app/${start}..${end}?from=${encodeURIComponent(f)}&to=${encodeURIComponent(t)}`;
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (!j || !j.rates) throw new Error('Bad payload');
        const rows = Object.entries(j.rates)
          .map(([d, o]) => [d, o[t]])
          .filter(([,v]) => typeof v === 'number')
          .sort((a,b) => a[0] < b[0] ? -1 : 1);
        if (rows.length < 2) { $('legend').textContent = 'Not enough data.'; return; }
        drawChart(rows, f, t);
      } catch (e) {
        $('legend').textContent = 'Historical data unavailable (offline mode). Connect to the internet to load the chart.';
      }
    }

    function drawChart(rows, f, t){
      const svg = $('chart');
      const W = 600, H = 260, padL = 50, padR = 12, padT = 12, padB = 28;
      const xs = rows.map(r => new Date(r[0]).getTime());
      const ys = rows.map(r => r[1]);
      const xMin = xs[0], xMax = xs[xs.length-1];
      const yMin = Math.min(...ys), yMax = Math.max(...ys);
      const yPad = (yMax - yMin) * 0.08 || yMax * 0.01 || 0.001;
      const y0 = yMin - yPad, y1 = yMax + yPad;
      const sx = x => padL + (x - xMin) / (xMax - xMin || 1) * (W - padL - padR);
      const sy = y => H - padB - (y - y0) / (y1 - y0 || 1) * (H - padT - padB);

      const pathD = rows.map((r,i) => (i?'L':'M') + sx(xs[i]).toFixed(2) + ' ' + sy(ys[i]).toFixed(2)).join(' ');
      const areaD = pathD + ` L${sx(xs[xs.length-1]).toFixed(2)} ${(H-padB).toFixed(2)} L${sx(xs[0]).toFixed(2)} ${(H-padB).toFixed(2)} Z`;

      // Y-axis gridlines (4 ticks)
      const ticks = 4;
      let grid = '';
      for (let i = 0; i <= ticks; i++) {
        const v = y0 + (y1 - y0) * (i / ticks);
        const yy = sy(v).toFixed(2);
        grid += `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity="0.12"/>`;
        grid += `<text x="${padL-6}" y="${yy}" text-anchor="end" dominant-baseline="middle" fill="currentColor" fill-opacity="0.6" font-size="10" font-family="monospace">${v.toFixed(4)}</text>`;
      }
      // X-axis labels (start, mid, end)
      const xLab = (idx) => `<text x="${sx(xs[idx]).toFixed(2)}" y="${H-8}" text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-size="10" font-family="monospace">${rows[idx][0]}</text>`;
      const labels = xLab(0) + xLab(Math.floor(rows.length/2)) + xLab(rows.length-1);

      svg.innerHTML = `
        <defs>
          <linearGradient id="cgrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}
        <path d="${areaD}" fill="url(#cgrad)"/>
        <path d="${pathD}" fill="none" stroke="#7c5cff" stroke-width="2"/>
        ${labels}
      `;
      const first = ys[0], last = ys[ys.length-1];
      const change = ((last - first) / first) * 100;
      const sign = change >= 0 ? '▲ +' : '▼ ';
      $('legend').textContent = `${f} → ${t}  ·  ${rows[0][0]} → ${rows[rows.length-1][0]}  ·  ${first.toFixed(4)} → ${last.toFixed(4)}  (${sign}${change.toFixed(2)}%)`;
    }

    // ----- wire up
    ['amount','from','to'].forEach(id => $(id).addEventListener('input', () => { convert(); if (id !== 'amount') loadChart(); }));
    $('swap').onclick = () => { const a=$('from').value; $('from').value=$('to').value; $('to').value=a; convert(); loadChart(); };
    $('rangeBtns').addEventListener('click', e => {
      const b = e.target.closest('button[data-range]'); if (!b) return;
      currentRange = b.dataset.range;
      $('rangeBtns').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      loadChart();
    });

    renderTable();
    convert();
    fetchLive().then(loadChart);
  </script>
  <script src="/site.js"></script>
</body>
